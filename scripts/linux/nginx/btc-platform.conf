# BTC 全市场智能研究平台 —— Nginx 反向代理配置
#
# 安装步骤（Ubuntu / Debian）：
#   sudo cp btc-platform.conf /etc/nginx/sites-available/btc-platform
#   sudo ln -s /etc/nginx/sites-available/btc-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 要点：
#   * 后端只监听 127.0.0.1:8787，不直接对外暴露，Nginx 是唯一入口
#   * 静态资源（含前端 index.html 与本地 echarts）由 Nginx 直接返回，减少后端压力
#   * /api/v1/system/* 的管理类接口用 X-Admin-Token 保护，这里额外按 IP 限制更安全
#   * SSE / WebSocket 类如果需要，必须显式关闭缓冲（末尾有注释示例）

upstream btc_platform {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;             # 改成你的域名，例如 btc.example.com

    client_max_body_size 20m;
    server_tokens off;

    # ---- 访问日志（排故障追源必备）----
    access_log /var/log/nginx/btc-platform.access.log;
    error_log  /var/log/nginx/btc-platform.error.log;

    root /opt/btc-platform/frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 静态资源：直接由 Nginx 提供（零构建前端，全部是静态文件）----
    location /static/ {
        alias /opt/btc-platform/frontend/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://btc_platform;
        access_log off;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://btc_platform;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;   # 长时间任务 / 流式响应不要缓冲
    }

    # ---- 管理类接口：建议只允许内网访问 ----
    location /api/v1/system/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://btc_platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ---- SPA 首页 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 如果需要 SSE（Server-Sent Events），加一段：
    # location /api/v1/system/stream {
    #     proxy_pass http://btc_platform;
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 3600s;
    #     chunked_transfer_encoding on;
    # }
}

