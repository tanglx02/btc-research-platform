<svg viewBox="0 0 680 500" width="680" height="500" xmlns="http://www.w3.org/2000/svg">
<rect width="680" height="500" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">数据源层 · 27 个 Provider，主源 + 备用链</text>
<rect x="40" y="34" width="600" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
<text x="120" y="54" font-weight="500" fill="#0C447C">行情 / 衍生品</text>
<text x="120" y="72" fill="#185FA5">Binance · OKX · Gate</text>
<text x="330" y="54" font-weight="500" fill="#0C447C">链上 / 资金流</text>
<text x="330" y="72" fill="#185FA5">mempool · Glassnode · ETF</text>
<text x="540" y="54" font-weight="500" fill="#0C447C">宏观 / 情绪</text>
<text x="540" y="72" fill="#185FA5">FRED · Fear &amp; Greed</text>
</g>

<path d="M340 86L340 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">接入层 · 统一出口：代理、DoH、重试、限流都在这落地</text>
<rect x="40" y="132" width="600" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
<text x="130" y="152" font-weight="500" fill="#633806">ProviderTransport</text>
<text x="130" y="170" fill="#854F0B">SOCKS5/HTTP 代理</text>
<text x="340" y="152" font-weight="500" fill="#633806">DoH 解析器</text>
<text x="340" y="170" fill="#854F0B">JSON + 二进制报文</text>
<text x="550" y="152" font-weight="500" fill="#633806">ResilientRouter</text>
<text x="550" y="170" fill="#854F0B">健康评分 · 自动切换</text>
</g>

<path d="M340 184L340 206" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="220" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">存储层 · 本地历史优先，Raw 与 Normalized 双写，幂等</text>
<rect x="40" y="230" width="600" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
<text x="140" y="250" font-weight="500" fill="#085041">Raw 原始 JSON</text>
<text x="140" y="268" fill="#0F6E56">可回溯到报文</text>
<text x="340" y="250" font-weight="500" fill="#085041">Normalized 规范化</text>
<text x="340" y="268" fill="#0F6E56">45 张表 · 断点续传</text>
<text x="540" y="250" font-weight="500" fill="#085041">SQLite / PostgreSQL</text>
<text x="540" y="268" fill="#0F6E56">开箱即用</text>
</g>

<path d="M340 282L340 304" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">引擎层 · 只吃本地历史，口径固定，防未来数据泄漏</text>
<rect x="40" y="328" width="600" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
<text x="110" y="348" font-weight="500" fill="#3C3489">指标 / 周期</text>
<text x="110" y="366" fill="#534AB7">估值 · Regime</text>
<text x="290" y="348" font-weight="500" fill="#3C3489">风险 / 预测</text>
<text x="290" y="366" fill="#534AB7">概率区间</text>
<text x="470" y="348" font-weight="500" fill="#3C3489">回测 / 回放</text>
<text x="470" y="366" fill="#534AB7">严格防泄漏</text>
<text x="612" y="348" font-weight="500" fill="#3C3489">预警</text>
<text x="612" y="366" fill="#534AB7">条件触发</text>
</g>

<path d="M340 380L340 402" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">交付层 · 每个数字都能点进去看它的来源</text>
<rect x="40" y="426" width="600" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
<text x="150" y="446" font-weight="500" fill="#2C2C2A">FastAPI · 79 个接口</text>
<text x="150" y="464" fill="#5F5E5A">OpenAPI 自动文档</text>
<text x="340" y="446" font-weight="500" fill="#2C2C2A">SPA 前端 · 35 个页面</text>
<text x="340" y="464" fill="#5F5E5A">零构建，原生 JS</text>
<text x="530" y="446" font-weight="500" fill="#2C2C2A">CLI · 一键脚本</text>
<text x="530" y="464" fill="#5F5E5A">Windows / Linux</text>
</g>
</svg>
